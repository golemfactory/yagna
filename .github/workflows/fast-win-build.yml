name: Windows cross-build

on:
  workflow_call:

jobs:
  build:
    name: Build Windows binary (x86-64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install tools
        uses: ./.github/actions/setup-tools
        with:
          tools: rust protoc node

      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64
          rustup target add x86_64-pc-windows-gnu

      - name: Build dashboard
        run: |
          git clone https://github.com/scx1332/yagna-dashboard.git yagna-dashboard
          cd yagna-dashboard
          git checkout 05c273ef2195bf1205309cc8736cf059d6317f16
          npm ci
          npm run build
          mv dist/* ../dashboard

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          shared-key: windows-cross

      - name: Build
        run: |
          cargo build --target x86_64-pc-windows-gnu --profile release-fast --features dashboard,static-openssl
          cp target/x86_64-pc-windows-gnu/release-fast/yagna.exe yagna.exe
          tar -czf yagna.tar.gz yagna.exe

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: yagna-windows-x86-64
          path: yagna.tar.gz
