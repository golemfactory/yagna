name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - deposits
      - release/*
      - '**/all-tests'
      - '**/integration-tests'
  pull_request:
    branches:
      - main
      - deposits
      - release/*
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-gate:
    name: Linux gate (lock, fmt, Clippy, unit)
    uses: ./.github/workflows/fmt-clippy.yml

  unit-macos:
    name: Unit / macOS
    needs: linux-gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:macos'))
    uses: ./.github/workflows/unit-test.yml
    with:
      runner: macos-latest

  unit-windows:
    name: Unit / Windows
    needs: linux-gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:windows'))
    uses: ./.github/workflows/unit-test.yml
    with:
      runner: windows-latest

  market-linux:
    name: Market / Linux
    needs: linux-gate
    if: github.event_name != 'push'
    uses: ./.github/workflows/market-test-suite.yml
    with:
      runner: ubuntu-latest

  market-macos:
    name: Market / macOS
    needs: linux-gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:macos'))
    uses: ./.github/workflows/market-test-suite.yml
    with:
      runner: macos-latest

  market-windows:
    name: Market / Windows
    needs: linux-gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:windows'))
    uses: ./.github/workflows/market-test-suite.yml
    with:
      runner: windows-latest

  system:
    name: System tests
    needs: linux-gate
    if: github.event_name != 'push'
    uses: ./.github/workflows/system-test.yml

  aarch64:
    name: AArch64 build
    needs: linux-gate
    if: github.event_name != 'push'
    uses: ./.github/workflows/binaries-aarch64.yml

  windows-cross:
    name: Windows cross-build
    needs: linux-gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:windows'))
    uses: ./.github/workflows/fast-win-build.yml

  integration:
    name: Integration tests
    needs: linux-gate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:e2e'))
    uses: ./.github/workflows/integration-test.yml
