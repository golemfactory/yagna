name: AArch64 build

on:
  workflow_call:

jobs:
  build:
    name: Build binaries (AArch64)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-C link-arg=-s"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        uses: ./.github/actions/setup-tools
        with:
          tools: "rust protoc cargo-binstall cargo:cross"

      - name: Install Rust target
        run: rustup target add aarch64-unknown-linux-musl

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          shared-key: aarch64-release

      - name: Build binaries
        run: >-
          cross build
          -p yagna
          -p ya-exe-unit
          -p ya-provider
          -p golemsp
          -p gftp
          --release
          --features static-openssl
          --target aarch64-unknown-linux-musl

      - name: Collect binaries
        run: |
          mkdir build
          cp target/aarch64-unknown-linux-musl/release/{yagna,ya-provider,exe-unit,golemsp,gftp} build

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: yagna-linux-aarch64
          path: build
