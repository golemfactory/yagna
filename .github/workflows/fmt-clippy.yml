name: Linux CI gate

on:
  workflow_call:

jobs:
  gate:
    name: Lock, fmt, Clippy, unit tests
    runs-on: ubuntu-24.04
    env:
      # Debug information and incremental state dominate disk usage in this
      # workspace. CI does not debug the produced test executables, and every
      # hosted runner is ephemeral.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        uses: ./.github/actions/setup-tools
        with:
          tools: actionlint rust protoc shellcheck

      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          shared-key: linux-gate-dependencies

      - name: Check lockfile
        run: mise run ci:lock

      - name: Validate workflows
        run: mise run ci:workflows

      - name: Check formatting
        run: mise run ci:fmt

      - name: Run Clippy
        run: mise run ci:clippy

      - name: Report disk usage after Clippy
        run: |
          df -h .
          du -sh target

      - name: Run Linux unit tests
        run: mise run ci:unit

      - name: Report final disk usage
        if: always()
        run: |
          df -h .
          du -sh target || true
