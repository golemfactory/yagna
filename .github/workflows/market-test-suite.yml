name: Market tests

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        type: string

jobs:
  market:
    name: Market tests (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    env:
      RUSTFLAGS: "-D warnings -C opt-level=z -C debuginfo=1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        uses: ./.github/actions/setup-tools
        with:
          tools: rust protoc

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          shared-key: market-${{ runner.os }}

      - name: Install OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $opensslRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
          "OPENSSL_DIR=$opensslRoot" >> $env:GITHUB_ENV
          "OPENSSL_LIB_DIR=$(Join-Path $opensslRoot 'lib')" >> $env:GITHUB_ENV
          "OPENSSL_INCLUDE_DIR=$(Join-Path $opensslRoot 'include')" >> $env:GITHUB_ENV

      - name: Run market tests
        run: mise run ci:market
